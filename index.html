<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./styles.css">
    <title>Weather App</title>
</head>
<body>
    <main class="weather-app">
        <!-- Search Form -->
        <form class="input-container" role="search">
            <label for="search" class="sr-only">Search city</label>
            <input  class="search" type="text" name="search" id="search" placeholder="e.g., New York" required>
            <button class="search" type="submit" aria-label="Search weather">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="search-icon">
                    <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
            </button>
        </form>

        <!-- Main Weather Display -->
        <section class="weather-display" aria-live="polite">
            <div class="weather-location">
                <img id="weather-img" src="./assets/clear.png" alt="Weather condition icon">
                <p class="temp" id="temp">--°C</p>
                <h1 id="location">New york</h1>
            </div>

            <!-- Details Section -->
            <div class="weather-info">
                <div class="info-card humidity-container">
                    <img src="./assets/humidity.png" class="info-icon" alt="Humidity icon">
                    <div class="humidity">
                        <p id="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="info-card wind-speed-container">
                    <img src="./assets/wind.png" class="info-icon" alt="Wind speed icon">
                    <div class="wind-speed">
                        <p id="wind-speed">-- km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
